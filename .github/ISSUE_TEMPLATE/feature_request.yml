name: Feature proposal
description: Propose a focused change consistent with the canonical GDD
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or player need
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed behavior and affected systems
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and validation
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, alternatives and dependencies
      description: Explain asset provenance or package changes if relevant.
