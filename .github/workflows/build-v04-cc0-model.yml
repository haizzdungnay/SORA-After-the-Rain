name: Build V04 Dense 9-Block CC0 Model
on:
  push:
    branches:
      - feature/neighborhood-v04-dense-nine-blocks
    paths:
      - .github/workflows/build-v04-cc0-model.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sora-v04-dense-cc0
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'haizzdungnay/SORA-After-the-Rain' && github.ref == 'refs/heads/feature/neighborhood-v04-dense-nine-blocks'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 3D processing packages
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'trimesh>=4.5,<5' 'Pillow>=10,<13'
      - name: Build V04 CC0-only mesh overlay
        run: |
          python -u Tools/StreetExterior/build_v04_dense_grid.py --root . --output ArtSource/Generated/V04_CC0
      - name: Verify real exported GLB and closed boundary
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import trimesh
          root=Path('ArtSource/Generated/V04_CC0')
          manifest=json.loads((root/'manifest.json').read_text())
          file=root/'SORA_V04_CC0_Dense_Overlay.glb'
          s=trimesh.load(file,force='scene',process=False)
          nodes=s.graph.nodes_geometry
          assert file.read_bytes()[:4]==b'glTF'
          assert hashlib.sha256(file.read_bytes()).hexdigest()==manifest['glb_sha256']
          assert len(nodes)==manifest['geometry_nodes']
          assert all('AFX' not in n for n in nodes)
          assert manifest['junctions']==16 and manifest['new_buildings']==60
          colliders=json.loads((root/'colliders.json').read_text())['items']
          assert len([c for c in colliders if c['group']=='HARD_BOUNDARY'])==4
          assert len([c for c in colliders if c['group']=='ROAD_BLOCK'])==16
          print('PASS',len(nodes),'nodes',len(colliders),'collision proxies; Unity NOT RUN')
          PY
      - name: Push GLB through Git LFS
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git lfs install --local
          git add ArtSource/Generated/V04_CC0/
          if git diff --cached --quiet; then
            echo 'No changed assets'
            exit 0
          fi
          git commit -m 'assets(env): add generated V04 CC0 nine-block model and collision manifest'
          git push origin HEAD:feature/neighborhood-v04-dense-nine-blocks
