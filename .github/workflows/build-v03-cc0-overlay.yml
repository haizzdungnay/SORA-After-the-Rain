name: Build SORA V03 CC0 Neighborhood Overlay

on:
  push:
    branches:
      - feature/neighborhood-v03-cc0-integration
    paths:
      - .github/workflows/build-v03-cc0-overlay.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sora-v03-cc0-overlay
  cancel-in-progress: false

jobs:
  build-cc0-overlay:
    if: github.repository == 'haizzdungnay/SORA-After-the-Rain' && github.ref == 'refs/heads/feature/neighborhood-v03-cc0-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
      - name: Prepare Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline model build dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'trimesh>=4.5,<5' 'Pillow>=10,<13'
      - name: Verify original CC0 asset files
        run: |
          python Tools/StreetExterior/verify_cc0_v02.py ArtSource/ThirdParty/CC0
      - name: Build actual CC0-only aligned model
        run: |
          python -u Tools/StreetExterior/build_v03_cc0_overlay.py --root . --output ArtSource/Generated/V03_CC0
      - name: Validate final generated GLB and LFS
        run: |
          python - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          import trimesh
          root=Path('ArtSource/Generated/V03_CC0')
          item=json.loads((root/'manifest.json').read_text())
          f=root/item['files'][0]['path']
          data=f.read_bytes()
          assert hashlib.sha256(data).hexdigest()==item['files'][0]['sha256']
          assert data[:4]==b'glTF' and struct.unpack_from('<I',data,8)[0]==len(data)
          s=trimesh.load(f,force='scene',process=False)
          ns=s.graph.nodes_geometry
          assert len(ns)==item['mesh_instances']
          assert all(item['checks'].values())
          assert not any('AFX' in n for n in ns)
          print('PASS overlay geometry nodes:',len(ns),'size:',len(data))
          PY
          git lfs install --local
          git check-attr filter ArtSource/Generated/V03_CC0/SORA_V03_CC0_Overlay.glb
      - name: Store CC0 overlay in Git LFS on feature branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add ArtSource/Generated/V03_CC0/
          if git diff --cached --quiet; then
            echo 'No new art output'
            exit 0
          fi
          git commit -m 'assets(env): add actual CC0-only V03 overlay GLB to Git LFS'
          git push origin HEAD:feature/neighborhood-v03-cc0-integration
