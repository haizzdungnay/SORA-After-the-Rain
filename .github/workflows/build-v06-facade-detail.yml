name: SORA V06 additive facade detail
on:
  push:
    branches: [feature/neighborhood-v06-facade-detail]
    paths:
      - 'Tools/StreetExterior/build_v06_facade_detail.py'
      - 'Tools/StreetExterior/test_v06_facade_detail.py'
      - '.github/workflows/build-v06-facade-detail.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sora-v06-facade-detail
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'haizzdungnay/SORA-After-the-Rain' && github.ref == 'refs/heads/feature/neighborhood-v06-facade-detail'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'trimesh>=4.5,<5' 'Pillow>=10,<13'
      - name: Offline regression and GLB export/reload test
        run: python Tools/StreetExterior/test_v06_facade_detail.py
      - name: Build V06 additive overlay
        run: |
          python Tools/StreetExterior/build_v06_facade_detail.py \
            --layout Docs/StreetExterior/V04_DENSE_GRID_LAYOUT.json \
            --v05-manifest ArtSource/Generated/V05_CC0/manifest.json \
            --output ArtSource/Generated/V06_CC0
      - name: Verify existing V05 target
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          a=Path('ArtSource/Generated/V06_CC0')
          doc=json.loads((a/'manifest.json').read_text())
          base=json.loads(Path('ArtSource/Generated/V05_CC0/manifest.json').read_text())
          data=(a/'SORA_V06_9Block_Facade_Details.glb').read_bytes()
          assert data[:4]==b'glTF'
          assert hashlib.sha256(data).hexdigest()==doc['glb_sha256']
          assert doc['target_v05_sha256']==base['glb_sha256']
          assert doc['new_v04_v05_facades_detailed']==60
          assert doc['new_colliders']==0
          print('PASS: 60 facade detail pass; Unity verification pending')
          PY
      - name: Push generated GLB via Git LFS
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git lfs install --local
          git lfs track 'ArtSource/Generated/V06_CC0/*.glb'
          git add .gitattributes ArtSource/Generated/V06_CC0/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets(v06): publish detail-only 60-storefront GLB'
          git fetch origin feature/neighborhood-v06-facade-detail
          git rebase origin/feature/neighborhood-v06-facade-detail
          git push origin HEAD:feature/neighborhood-v06-facade-detail
